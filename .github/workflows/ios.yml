name: iOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure and generation
        run: |
          python3 -m unittest discover -s Tests/Build -v
          git diff --exit-code -- Pomodoro.xcodeproj
      - name: Record toolchain
        run: |
          mkdir -p build
          xcodebuild -version | tee build/toolchain.log
          xcodebuild -showsdks | tee -a build/toolchain.log
          xcodebuild -list -project Pomodoro.xcodeproj | tee -a build/toolchain.log
      - name: Test portable core
        run: |
          set -o pipefail
          swift test 2>&1 | tee build/core-tests.log
      - name: Compile iOS app for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pomodoro.xcodeproj -scheme Pomodoro \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator-build.log
      - name: Select and boot iPhone simulator
        run: |
          SIMULATOR_ID=$(python3 Scripts/select_simulator.py)
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and test on simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pomodoro.xcodeproj -scheme Pomodoro \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/simulator.log
      - name: Build Release for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pomodoro.xcodeproj -scheme Pomodoro \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/Release \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/release.log
      - name: Package unsigned device IPA
        run: |
          test ! -d build/Release/Build/Products/Release-iphoneos/Pomodoro.app/PlugIns
          mkdir -p build/IPA/Payload
          ditto build/Release/Build/Products/Release-iphoneos/Pomodoro.app \
            build/IPA/Payload/Pomodoro.app
          cd build/IPA
          ditto -c -k --keepParent Payload ../Pomodoro.ipa
      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-IPA
          path: build/Pomodoro.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Pomodoro.app \
            build/Pomodoro-Simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Simulator
          path: build/Pomodoro-Simulator.zip
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  native-build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record native toolchain
        run: |
          mkdir -p build
          xcodebuild -version | tee build/native-toolchain.log
          xcodebuild -list -project Pomodoro.xcodeproj | tee -a build/native-toolchain.log
      - name: Compile native app and extension for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pomodoro.xcodeproj -scheme PomodoroNative \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/NativeSimulator \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/native-simulator-build.log
          python3 Scripts/verify_native_bundle.py build/NativeSimulator/Build/Products/Debug-iphonesimulator/PomodoroNative.app
      - name: Build native Release for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pomodoro.xcodeproj -scheme PomodoroNative \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/NativeRelease \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/native-release.log
          python3 Scripts/verify_native_bundle.py build/NativeRelease/Build/Products/Release-iphoneos/PomodoroNative.app
      - name: Test native integration on simulator
        run: |
          set -o pipefail
          SIMULATOR_ID=$(python3 Scripts/select_simulator.py)
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project Pomodoro.xcodeproj -scheme PomodoroNative \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/NativeSimulator \
            -resultBundlePath build/NativeTests.xcresult \
            -parallel-testing-enabled NO ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/native-tests.log
      - name: Package unsigned native IPA
        run: |
          mkdir -p build/NativeIPA/Payload
          ditto build/NativeRelease/Build/Products/Release-iphoneos/PomodoroNative.app \
            build/NativeIPA/Payload/PomodoroNative.app
          cd build/NativeIPA
          ditto -c -k --keepParent Payload ../Pomodoro-Native.ipa
      - name: Upload native device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Native-IPA
          path: build/Pomodoro-Native.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics
          path: |
            build/native-*.log
            build/NativeTests.xcresult
          if-no-files-found: warn
          retention-days: 14
